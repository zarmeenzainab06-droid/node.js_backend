<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — GymFitex</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f4f6;
    font-family: Arial, Helvetica, sans-serif;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 14px;
    padding: 32px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  .brand {
    color: #E53935;
    font-size: 22px;
    font-weight: bold;
    margin: 0 0 4px;
    text-align: center;
  }
  h1 {
    font-size: 18px;
    color: #222;
    text-align: center;
    margin: 0 0 24px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field { margin-bottom: 18px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="password"]:focus { border-color: #E53935; }
  button {
    width: 100%;
    padding: 13px;
    background: #E53935;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 4px;
  }
  button:disabled { background: #f0a4a1; cursor: not-allowed; }
  .msg {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    display: none;
    line-height: 1.5;
  }
  .msg.error { background: #fdecea; color: #c62828; display: block; }
  .msg.success { background: #eaf7ec; color: #2e7d32; display: block; }
  .state { text-align: center; padding: 20px 0; color: #777; font-size: 14px; }
  a.login-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    color: #E53935;
    font-size: 13.5px;
    text-decoration: none;
    font-weight: 600;
  }
  .hidden { display: none; }
</style>
</head>
<body>
 
<div class="card">
  <p class="brand">GymFitex</p>
  <h1>Reset Your Password</h1>
 
  <div id="checkingState" class="state">Checking your reset link…</div>
 
  <div id="invalidState" class="hidden">
    <div class="msg error" style="display:block;">
      This reset link is invalid or has expired. Please request a new one from the app.
    </div>
  </div>
 
  <form id="resetForm" class="hidden">
    <div class="field">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" minlength="6" required />
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter new password" minlength="6" required />
    </div>
    <button type="submit" id="submitBtn">Reset Password</button>
    <div id="formMsg" class="msg"></div>
  </form>
 
  <div id="successState" class="hidden">
    <div class="msg success" style="display:block;">
      Your password has been reset successfully! You can now log in with your new password.
    </div>
  </div>
</div>
 
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const email = params.get('email');
 
  const checkingState = document.getElementById('checkingState');
  const invalidState  = document.getElementById('invalidState');
  const resetForm     = document.getElementById('resetForm');
  const successState  = document.getElementById('successState');
  const formMsg       = document.getElementById('formMsg');
  const submitBtn     = document.getElementById('submitBtn');
 
  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }
 
  async function verifyToken() {
    if (!token || !email) {
      hide(checkingState);
      show(invalidState);
      return;
    }
    try {
      const res = await fetch(
        `/verify-reset-token?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`
      );
      const data = await res.json();
      hide(checkingState);
      if (data.success) {
        show(resetForm);
      } else {
        show(invalidState);
      }
    } catch (err) {
      hide(checkingState);
      show(invalidState);
    }
  }
 
  resetForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    formMsg.style.display = 'none';
 
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
 
    if (newPassword.length < 6) {
      formMsg.textContent = 'Password must be at least 6 characters.';
      formMsg.className = 'msg error';
      return;
    }
    if (newPassword !== confirmPassword) {
      formMsg.textContent = 'Passwords do not match.';
      formMsg.className = 'msg error';
      return;
    }
 
    submitBtn.disabled = true;
    submitBtn.textContent = 'Resetting…';
 
    try {
      const res = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, email, newPassword }),
      });
      const data = await res.json();
 
      if (data.success) {
        hide(resetForm);
        show(successState);
      } else {
        formMsg.textContent = data.message || 'Something went wrong. Please try again.';
        formMsg.className = 'msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    } catch (err) {
      formMsg.textContent = 'Network error. Please try again.';
      formMsg.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Reset Password';
    }
  });
 
  verifyToken();
</script>
 
</body>
</html>
